server:
  port: 8081
  servlet:
    context-path: /api

# Documentation related properties
springdoc:
  swagger-ui:
    path: /oasis-api-spec.html
    operationsSorter: alpha
    tagsSorter: alpha

# Liquibase configs
spring:
  liquibase:
    enabled: false
  jpa:
    generate-ddl: false
    hibernate:
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

oasis:
  configs:
    path:
  schema:
    dir: "classpath:io/github/oasis/db/schema/oasis-changelog-master.yml"
