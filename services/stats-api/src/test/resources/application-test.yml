server:
  port: 8081
  servlet:
    context-path: /api

# Documentation related properties
springdoc:
  swagger-ui:
    path: /oasis-api-spec.html
    operationsSorter: alpha
    tagsSorter: alpha

# Liquibase configs
spring:
  main:
    allow-bean-definition-overriding: true
  liquibase:
    enabled: false

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: weAimHigh
    url: "jdbc:mysql://localhost:33070/oasis?createDatabaseIfNotExist=true"

  jpa:
    generate-ddl: false
    hibernate:
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Oasis configurations
oasis:
  configs:
    path: "classpath:test-configs.yml"
  schema:
    dir: "classpath:io/github/oasis/db/schema/oasis-changelog-master.yml"