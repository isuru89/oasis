http:
  port: 8050
  ssl: false

oasis:
  db:
    engine: redis
    admin: jpa

  jdbc:
    url: "jdbc:mysql://localhost:33070/oasis?createDatabaseIfNotExist=true"
    driver: com.mysql.cj.jdbc.Driver
    user: root
    password: weAimHigh

  defaultApiKeys: "root:root,admin:admin:7,guest:guest:0"

  cache:
    url: redis://localhost:6379

    connectionRetries: 5
    connectionRetryDelay: 5000

    pool:
      max: 16
      maxIdle: 16
      minIdle: 4

  enginedb:
    url: redis://localhost:6379

    connectionRetries: 5
    connectionRetryDelay: 5000

    pool:
      max: 16
      maxIdle: 16
      minIdle: 4

  eventstream:
    impl: "classpath:io.github.oasis.core.services.api.beans.TestDispatcherFactory"
    configs:
      brokerUrls: "localhost:29092"

